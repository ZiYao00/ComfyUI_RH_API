name: Publish to Comfy Registry (manual, opt-in)

# GitHub clone distribution does not require Registry publication.
# Only enable this job after setting your own [tool.comfy] PublisherId,
# REGISTRY_ACCESS_TOKEN secret, and COMFY_REGISTRY_ENABLED repository variable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-node:
    if: ${{ vars.COMFY_REGISTRY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
